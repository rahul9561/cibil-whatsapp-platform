openapi: 3.0.3
info:
  title: CIBIL WhatsApp Platform - Admin API
  version: 1.0.0
paths:
  /api/v1/analytics/funnel:
    get:
      operationId: analytics_funnel_retrieve
      parameters:
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/revenue:
    get:
      operationId: analytics_revenue_list
      parameters:
      - in: query
        name: export
        schema:
          type: string
          enum:
          - csv
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - month
          - week
      - in: query
        name: to
        schema:
          type: string
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevenueRow'
          description: ''
  /api/v1/audit-logs:
    get:
      operationId: audit_logs_list
      description: 'Per-action capability, e.g. `capabilities = {"list": "report.view",
        "*": "report.manage"}`.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - anonymous
          - customer
          - system
          - user
          - webhook
        description: |-
          * `user` - User
          * `system` - System
          * `webhook` - Webhook
          * `customer` - Customer
          * `anonymous` - Anonymous
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: object_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: request_id
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit-logs/{id}:
    get:
      operationId: audit_logs_retrieve
      description: 'Per-action capability, e.g. `capabilities = {"list": "report.view",
        "*": "report.manage"}`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit-logs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
