  /api/v1/follow-ups:
    get:
      operationId: follow_ups_list
      description: 'Per-action capability, e.g. `capabilities = {"list": "report.view",
        "*": "report.manage"}`.'
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: User id, "me" or "unassigned"
      - in: query
        name: open
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: overdue
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: array
          items:
            type: integer
            enum:
            - 1
            - 2
            - 3
        description: |-
          * `1` - Low
          * `2` - Normal
          * `3` - High
        explode: true
        style: form
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - closed_lost
            - closed_manual
            - closed_paid
            - escalated
            - in_progress
            - open
        description: |-
          * `open` - Open
          * `in_progress` - In progress
          * `escalated` - Escalated
          * `closed_paid` - Closed — paid
          * `closed_lost` - Closed — lost
          * `closed_manual` - Closed — manually
        explode: true
        style: form
      tags:
      - follow-ups
