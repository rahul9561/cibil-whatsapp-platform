        * `consented` - Consent given
        * `otp_sent` - OTP sent
        * `otp_verified` - OTP verified
        * `fetching` - Fetching report
        * `generated` - Report generated
        * `failed` - Failed
        * `no_hit` - No credit history
        * `expired` - Expired
        * `cancelled` - Cancelled
    RevealRequest:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldsEnum'
          minItems: 1
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - fields
      - reason
    RevenueRow:
      type: object
      properties:
        period:
          type: string
        payments:
          type: integer
        gross_paise:
          type: integer
        refunds_paise:
          type: integer
        net_paise:
          type: integer
      required:
      - gross_paise
      - net_paise
      - payments
      - period
      - refunds_paise
    RoleEnum:
      enum:
      - super_admin
      - admin
      - agent
      - finance
      - auditor
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `admin` - Admin
        * `agent` - Follow-up Agent
        * `finance` - Finance
        * `auditor` - Auditor (read-only)
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_login_ip:
          type: string
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        two_factor_enrolled:
          type: boolean
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - last_login
      - last_login_ip
      - two_factor_enrolled
    StaffCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TemplateKeyEnum:
      enum:
      - payment_link
      - payment_reminder
      type: string
      description: |-
        * `payment_link` - payment_link
        * `payment_reminder` - payment_reminder
    TokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - token
    TypeEnum:
      enum:
      - text
      - template
      - interactive
      - document
      - image
      - other
      type: string
      description: |-
        * `text` - Text
        * `template` - Template
        * `interactive` - Interactive
        * `document` - Document
        * `image` - Image
        * `other` - Other
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
