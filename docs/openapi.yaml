components:
  schemas:
    ActorTypeEnum:
      enum:
      - user
      - system
      - webhook
      - customer
      - anonymous
      type: string
      description: |-
        * `user` - User
        * `system` - System
        * `webhook` - Webhook
        * `customer` - Customer
        * `anonymous` - Anonymous
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
        actor:
          type: string
          format: uuid
          nullable: true
        actor_label:
          type: string
          maxLength: 254
        actor_type:
          $ref: '#/components/schemas/ActorTypeEnum'
        action:
          type: string
          maxLength: 100
        object_type:
          type: string
          maxLength: 100
        object_id:
          type: string
          maxLength: 64
        changes: {}
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 255
        request_id:
          type: string
          maxLength: 64
      required:
      - action
      - actor_type
      - created_at
      - id
    BlankEnum:
      enum:
      - ''
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
    ChannelEnum:
      enum:
      - call
      - whatsapp
      - other
      type: string
      description: |-
        * `call` - Phone call
        * `whatsapp` - WhatsApp
        * `other` - Other
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
        name:
          type: string
        pan:
          type: string
        email:
          type: string
          readOnly: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        opted_out_at:
          type: string
          format: date-time
          nullable: true
        open_request:
          type: string
          nullable: true
          readOnly: true
      required:
      - created_at
      - email
      - id
      - name
      - open_request
      - pan
      - phone
    DecisionRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 255
    DeliveryStatusEnum:
      enum:
      - not_delivered
      - queued
      - sent
      - delivered
      - read
      - failed
      type: string
      description: |-
        * `not_delivered` - Not delivered
        * `queued` - Queued
        * `sent` - Sent
        * `delivered` - Delivered
        * `read` - Read
        * `failed` - Failed
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - Inbound
        * `out` - Outbound
    FieldsEnum:
      enum:
