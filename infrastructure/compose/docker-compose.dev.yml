# Local development stack.
# Run from the repo root:
#   docker compose -f infrastructure/compose/docker-compose.dev.yml --env-file .env up --build
name: cibil-dev

# web builds the image once; worker and beat reuse it.
x-backend: &backend
  image: cibil-backend:dev
  env_file: ../../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    PRIVATE_STORAGE_ROOT: /data/private/reports
  volumes:
    - ../../backend:/app
    - private_reports:/data/private/reports
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"   # host access for DB tools only, bound to loopback
    volumes:
      - mysql_data:/var/lib/mysql
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  web:
    <<: *backend
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
      args:
        REQUIREMENTS: dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker -l info -Q default,webhooks,provider,messaging,payments,reminders
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

volumes:
  mysql_data:
  redis_data:
  private_reports:
