# Local stand-in for production: serves the built SPA and proxies the API on one origin (http://localhost:8080).
# Production TLS, rate limits and caching rules arrive in Phase 11.
# Cache policy by path (set once at server level: an add_header inside a location would drop all others).
map $uri $cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    location ~ ^/(api|webhooks|django-admin|static|healthz|readyz)(/|$) {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    root /usr/share/nginx/html;

    # Hashed assets never change: cache for a year. index.html must always be revalidated.
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
